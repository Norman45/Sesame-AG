name: Build APK

on:
  workflow_dispatch:

env:
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore (optional)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_PASSWORD=${KS_KEY_PASS:-$KS_PASS}"
              echo "KEY_ALIAS=${KS_ALIAS:-release}"
            } >> "$GITHUB_ENV"
            echo "已注入签名密钥，产物将是已签名 APK"
          else
            echo "未配置 ANDROID_SIGNING_KEY，产物将是未签名 APK（不能直接安装）"
          fi

      - name: Build Release APKs
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # 上游 build.gradle.kts 的 release 直接复用 debug 签名，不读取上面的 KEYSTORE_* 环境变量，
      # 所以这里用 apksigner 以 release.jks 重新签名，保证证书与既有安装包一致、可覆盖安装。
      - name: Re-sign APKs with release keystore
        if: env.KEYSTORE_FILE != ''
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/${ANDROID_BUILD_TOOLS}"
          ls "$BT/apksigner" >/dev/null
          for apk in app/build/outputs/apk/release/*.apk; do
            out="$RUNNER_TEMP/$(basename "$apk")"
            "$BT/zipalign" -p -f 4 "$apk" "$out"
            "$BT/apksigner" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              "$out"
            "$BT/apksigner" verify --print-certs "$out" | grep -i "SHA-256" || true
            cp "$out" "$apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-apk
          path: app/build/outputs/apk/release/*.apk
